# =============================================================================
# Host Service — Declarative Commands Catalog
# Single source of truth for execution argv and authorization risk
# =============================================================================

commands:
  - name: calculator
    command:
      - gnome-calculator
    risk: low

  - name: github
    command:
      - github
    risk: low

  - name: backup
    command:
      - /usr/local/bin/nova-backup
    risk: medium

  - name: format-disk
    command:
      - /usr/local/bin/nova-format-disk
    risk: high
